[package]
name = "fastxslt-dotnet-workbench"
description = "Unstable native boundary for the FastXSLT ASP.NET workbench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fastxslt = { path = "../fastxslt", features = ["workbench"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
