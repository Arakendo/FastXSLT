suite = "W3C XSLT 3.0 test suite"
revision = "6f8fd9e966ae74a251a2604abef9d904c7bc5c9b"
set_file = "tests/fn/root/_root-test-set.xml"
case_count = 10

[default_disposition]
selection = "harness-unsupported"
execution = "not-run"
rationale = "Unless overridden below, the root() case requires function-argument location paths, empty sequences, variables, generated node identity, temporary trees, dynamic resource access, or broader kind-test expressions that have not been admitted through the private execution slice."

[[case_override]]
case_name = "root-0101"
selection = "selected"
execution = "passed"
rationale = "The unchanged XSLT 2.0 case evaluates root(.) from the principal document-node context, charges every inspected ancestor, and matches the native XML assertion."

[[case_override]]
case_name = "root-0102"
selection = "selected"
execution = "passed"
rationale = "The unchanged XSLT 2.0 case resolves a stylesheet-bound xs prefix into an expanded child-name test, applies root() to both unqualified and qualified child paths, and matches the native XML assertion."

[[case_override]]
case_name = "root-0103"
selection = "selected"
execution = "passed"
rationale = "The unchanged XSLT 2.0 case applies root() to two empty child paths and the explicit empty sequence; every call returns the empty sequence and the native empty result matches."

[[case_override]]
case_name = "root-0104"
selection = "selected"
execution = "passed"
rationale = "The unchanged XSLT 2.0 case binds two invocation-local source-node variables, including a namespace-qualified child selection, and applies root() without copying or detaching source identity."

[[case_override]]
case_name = "root-0201"
selection = "selected"
execution = "passed"
rationale = "The unchanged XSLT 2.0 case selects the principal element, walks to its document root, and matches the native empty string-value result."

[[case_override]]
case_name = "root-0301"
selection = "selected"
execution = "passed"
rationale = "The unchanged XSLT 2.0 case compares the generated identity of a selected element's root with the invocation-local identity captured for the principal document node."

[[case_override]]
case_name = "root-0401"
selection = "selected"
execution = "passed"
rationale = "The unchanged XSLT 2.0 case applies root() to the principal document node itself and compares its generated identity with the invocation-local identity captured for that same node."

[[case_override]]
case_name = "root-0501"
selection = "selected"
execution = "passed"
rationale = "The unchanged XSLT 2.0 case gives its invocation-local temporary tree a first-class document identity and proves root() returns that same identity for both the tree variable and its selected descendant element."

[[case_override]]
case_name = "root-0502"
selection = "selected"
execution = "passed"
rationale = "The unchanged XSLT 2.0 case resolves a literal document() reference only against the sealed snapshot, prepares one invocation-owned secondary document, and preserves its root identity across repeated access and descendant selection."

[[case_override]]
case_name = "root-0601"
selection = "selected"
execution = "passed"
rationale = "The unchanged XSLT 2.0 case applies root() to child element(), comment(), node(), and text() kind tests; typed child selection produces the two native document-root string values without treating kind tests as element names."
