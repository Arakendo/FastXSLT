suite = "W3C XSLT 3.0 test suite"
revision = "6f8fd9e966ae74a251a2604abef9d904c7bc5c9b"

[[case]]
set_file = "tests/decl/template/_template-test-set.xml"
case_name = "template-001"
selection = "selected"
execution = "passed"
rationale = "Built-in document dispatch, comment() child selection, comment-node pattern matching, and an unprefixed named mode now execute through the private semantic path."

[[case]]
set_file = "tests/decl/template/_template-test-set.xml"
case_name = "template-002"
selection = "selected"
execution = "passed"
rationale = "Processing-instruction child selection and pattern matching execute in an isolated named mode through the same node-kind seam as template-001."

[[case]]
set_file = "tests/decl/template/_template-test-set.xml"
case_name = "template-003"
selection = "selected"
execution = "passed"
rationale = "General child-node selection and node() pattern matching execute in an isolated named mode while exact element rules retain higher priority."

[[case]]
set_file = "tests/decl/template/_template-test-set.xml"
case_name = "template-004"
selection = "selected"
execution = "passed"
rationale = "Unprefixed attribute-axis selection and attribute pattern matching execute in an isolated named mode without treating attributes as children."

[[case]]
set_file = "tests/decl/template/_template-test-set.xml"
case_name = "template-005"
selection = "selected"
execution = "passed"
rationale = "Named-template lookup, string parameter binding, variable value access, integer equality conditionals, calls, and bounded recursion execute through the private semantic path."

[[case]]
set_file = "tests/decl/template/_template-test-set.xml"
case_name = "template-006"
selection = "selected"
execution = "passed"
rationale = "Root template and an empty unnamespaced literal result element exercise the current private slice; the absent xsl:output declaration also pressures output-method inference."

[[case]]
set_file = "tests/attr/avt/_avt-test-set.xml"
case_name = "avt-0701"
selection = "selected"
execution = "harness-unsupported"
rationale = "Referenced environment plus all-of/assert-message/assert-eq preserves a compound assertion family that the private harness cannot yet compare."

[[case]]
set_file = "tests/expr/path/_path-test-set.xml"
case_name = "path-001"
selection = "selected"
execution = "passed"
rationale = "A final explicit child::name existence predicate executes over the current relative child path, with candidate and predicate-node visits charged to the invocation work budget."

[[case]]
set_file = "tests/expr/path/_path-test-set.xml"
case_name = "path-002"
selection = "selected"
execution = "passed"
rationale = "The file-backed source is imported into a sealed snapshot, then leading descendant navigation and a final ancestor::element2 existence predicate execute with charged node visits."

[[case]]
set_file = "tests/expr/path/_path-test-set.xml"
case_name = "path-003"
selection = "selected"
execution = "passed"
rationale = "The shared file-backed source snapshot executes through leading descendant navigation and a final ancestor-or-self::element2 existence predicate with self-first, charged node inspection."

[[case]]
set_file = "tests/expr/path/_path-test-set.xml"
case_name = "path-004"
selection = "selected"
execution = "passed"
rationale = "The file-backed source snapshot executes through leading descendant navigation and a final attribute::attr1 existence predicate over separately owned, charged attribute nodes."

[[case]]
set_file = "tests/expr/path/_path-test-set.xml"
case_name = "path-005"
selection = "selected"
execution = "passed"
rationale = "The file-backed source snapshot executes a final descendant-or-self::child2 existence predicate with self-first, document-order, charged traversal."

[[case]]
set_file = "tests/expr/path/_path-test-set.xml"
case_name = "path-006"
selection = "selected"
execution = "passed"
