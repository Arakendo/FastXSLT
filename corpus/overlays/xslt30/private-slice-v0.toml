[[case]]
set_file = "tests/expr/path/_path-test-set.xml"
case_name = "path-007"
selection = "selected"
execution = "passed"
rationale = "The inline source snapshot executes a checked constant-integer positional predicate with XPath arithmetic precedence for multiplication, addition, subtraction, exact div, mod, and parentheses."

[[case]]
set_file = "tests/expr/path/_path-test-set.xml"
case_name = "path-008"
selection = "selected"
execution = "passed"
rationale = "The inline source snapshot executes a floor() call within checked constant-integer positional arithmetic; floor is admitted only over the parser's integer domain."

[[case]]
set_file = "tests/expr/path/_path-test-set.xml"
case_name = "path-009"
selection = "selected"
execution = "passed"
rationale = "The inline source snapshot executes floor(2) as a numeric position over the name-matched element1 sequence within the checked constant-integer domain."

[[case]]
set_file = "tests/expr/path/_path-test-set.xml"
case_name = "path-010"
selection = "selected"
execution = "passed"
rationale = "The file-backed source snapshot executes predicates on individual path steps, last() over the final name-matched sequence, and the same compiled path semantics as a template match pattern."

[[case]]
set_file = "tests/expr/for/_for-test-set.xml"
case_name = "for-001"
selection = "selected"
execution = "passed"
rationale = "The native source and stylesheet execute xsl:sequence with ordered for/distinct-values binding, value comparisons, related path selection, and source-node copying against the file-backed XML assertion."

[[case]]
set_file = "tests/expr/for/_for-test-set.xml"
case_name = "for-002"
selection = "selected"
execution = "passed"
rationale = "The source-free request invokes native initial template main, evaluates two ordered integer bindings and addition results, and joins the atomic sequence with the native xsl:value-of separator."

[[case]]
set_file = "tests/expr/for/_for-test-set.xml"
case_name = "for-003"
selection = "selected"
execution = "passed"
rationale = "The native for03 source preserves the outer order focus across the for binding, so unqualified attribute multiplication produces an empty sequence and sum() returns the asserted zero."

[[case]]
set_file = "tests/expr/for/_for-test-set.xml"
case_name = "for-004"
selection = "selected"
execution = "passed"
rationale = "The native for03 source executes exact-decimal multiplication over bound-variable attributes, sum aggregation, and the narrow two-decimal format-number picture without binary floating-point conversion."

[[case]]
set_file = "tests/expr/castable/_castable-test-set.xml"
case_name = "castable-001"
selection = "selected"
execution = "passed"
rationale = "The native XSLT20+ case executes built-in atomic lexical castability across string, numeric, duration, date, and time types, with inherited literal-result namespace bindings retained in serialization."

